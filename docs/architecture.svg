<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Financial event ledger architecture</title>
  <desc id="desc">HTTP ingest writes an event, a balanced journal pair, and an outbox row in one transaction. An outbox processor publishes downstream. Reconciliation compares events to journal lines.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="420" fill="#f8fafc"/>
  <text x="40" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Ingest → journal → outbox → reconcile</text>
  <text x="40" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">One database transaction posts the event, both ledger lines, and the outbox row.</text>

  <rect x="40" y="90" width="150" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="115" y="121" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">HTTP client</text>
  <text x="115" y="141" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#075985">Idempotency-Key</text>

  <line x1="190" y1="125" x2="248" y2="125" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="250" y="80" width="170" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="335" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Ingest API</text>
  <text x="335" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1e40af">POST /api/v1/events</text>
  <text x="335" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1e40af">payload hash + replay</text>

  <line x1="420" y1="125" x2="478" y2="125" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="480" y="70" width="220" height="110" rx="8" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="590" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3f6212">Single DB transaction</text>
  <text x="590" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4d7c0f">events row</text>
  <text x="590" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4d7c0f">debit + credit journal lines</text>
  <text x="590" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4d7c0f">outbox row + audit record</text>

  <line x1="590" y1="180" x2="590" y2="228" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="470" y="230" width="240" height="80" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="590" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Outbox processor</text>
  <text x="590" y="284" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c2410c">at-least-once publish · 3 retries</text>

  <line x1="710" y1="270" x2="768" y2="270" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="770" y="230" width="170" height="80" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="855" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#86198f">Downstream sink</text>
  <text x="855" y="284" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a21caf">log + in-memory list</text>

  <line x1="770" y1="250" x2="768" y2="168" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="770" y="90" width="170" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="855" y="121" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7f1d1d">Dead letter</text>
  <text x="855" y="141" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#991b1b">retry requeues outbox</text>

  <rect x="40" y="230" width="380" height="80" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Reconciliation</text>
  <text x="230" y="284" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334155">accepted events vs journal lines · control totals</text>

  <line x1="420" y1="270" x2="468" y2="270" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="230" y1="230" x2="335" y2="170" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3"/>

  <rect x="40" y="340" width="900" height="50" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="60" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">PostgreSQL  ·  Flyway  ·  numeric(20,2) money  ·  balances derived from journal_lines, never a mutable cache</text>
</svg>
