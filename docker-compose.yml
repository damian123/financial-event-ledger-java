services:
  postgres:
    image: postgres:16-alpine
    container_name: eventledger-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eventledger
      POSTGRES_USER: eventledger
      POSTGRES_PASSWORD: eventledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventledger -d eventledger"]
      interval: 5s
      timeout: 5s
      retries: 10
